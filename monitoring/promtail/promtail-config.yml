# Promtail: Docker 컨테이너 로그를 수집해 Loki로 전송한다.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 컨테이너 이름을 라벨로 붙여 Grafana에서 필터링하기 쉽게 한다.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
